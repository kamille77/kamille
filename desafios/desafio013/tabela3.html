<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
         
        }
 th, td{
        border: 1px solid gray;
        padding: 10px;
      }
      table{
        border-collapse: collapse;
        width: 80%;
      }
      .grey, th{
     color: white;
            border: 1px solid black;
            padding: 10px;
            background-color: rgba(85, 81, 81, 0.832);
            position: sticky;
            top: 0;
 }
 .branco{
    background-color: white;
    color: black;
 }
    </style>
</head>
<body>
   <table>
       <thead>
        <tr>
            <th rowspan="2">Área</th>
            <th rowspan="2">Disciplinas</th>
            <th colspan="2">Notas</th>
            <th rowspan="2">Média</th>
        </tr>
        <tr>
            <th>Nota1</th>
            <th>Nota2</th>
        </tr>
    
       </thead>
       <tbody>
<tr>
    <th rowspan="4", class="branco">Exatas</th>
    <td>Matemática</td>
    <td>25</td>
    <td>00</td>
    <td>00</td>

</tr>
<tr>
   
    <td>Física</td>
    <td>25</td>
    <td>00</td>
    <td>00</td>

</tr>
<tr>
   
    <td>Química</td>
    <td>25</td>
    <td>00</td>
    <td>00</td>

</tr>
<tr>
  
    <td>Biologia</td>
    <td>25</td>
    <td>00</td>
    <td>00</td>

</tr>
<tr>
    <th colspan="4">Média de Exatas</th>
    <td class="grey">00</td>
</tr>
<tr>
    <th rowspan="2", class="branco">Humanas</th>
    <td>História</td>
    <td>00</td>
     <td>00</td>
      <td>00</td>

</tr>
<tr>
<td>Geografia</td>
    <td>00</td>
     <td>00</td>
      <td>00</td>

</tr>
<tr>
    <th colspan="4">Média de Humanas</th>
    <td class="grey">00</td>
</tr>

       </tbody>
   </table>
</body>
</html>
